      <path d="M0 0 H156" stroke="#ff8a4c" stroke-width="16"/>
      <text x="0" y="49" fill="#ffbd91" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">CPU saturation</text>
    </g>
