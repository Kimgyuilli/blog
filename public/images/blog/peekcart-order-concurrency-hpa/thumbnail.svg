    <text x="28" y="47" fill="#b8c7c2" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">Incoming traffic</text>
    <text x="28" y="102" fill="#eff6f3" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="780">1000</text>
    <text x="28" y="132" fill="#74857f" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="540">virtual users</text>
    <g transform="translate(28 166)" fill="none" stroke-linecap="round">
