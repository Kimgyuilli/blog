<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PeekCart order concurrency load test thumbnail</title>
  <desc id="desc">A technical thumbnail showing one thousand virtual users, Kubernetes HPA scale-out, and inventory protected from overselling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1110"/>
      <stop offset="0.58" stop-color="#121d1b"/>
      <stop offset="1" stop-color="#26313d"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35d6aa"/>
      <stop offset="1" stop-color="#0f9f79"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182422"/>
      <stop offset="1" stop-color="#101816"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <g opacity="0.34">
    <path d="M86 161 C252 101 387 180 516 151 C646 121 731 64 884 91 C1016 114 1098 181 1148 149" fill="none" stroke="#35d6aa" stroke-width="2"/>
    <path d="M84 486 C245 429 379 489 522 461 C642 437 731 395 881 426 C1006 452 1094 525 1149 492" fill="none" stroke="#8bb7ff" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <g transform="translate(82 74)">
    <text x="0" y="0" fill="#35d6aa" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">PEEKCART LOAD TEST</text>
    <text x="0" y="61" fill="#eff6f3" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="760">1000 VU Orders</text>
    <text x="0" y="105" fill="#b8c7c2" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="520">Throughput failed. Inventory stayed correct.</text>
  </g>

  <g transform="translate(82 198)" filter="url(#softShadow)">
