  <g transform="translate(150 506)">
    <rect width="900" height="96" rx="24" fill="#f5f8f7" opacity="0.96" filter="url(#softShadow)"/>
    <g transform="translate(44 22)">
      <rect x="0" y="18" width="52" height="34" rx="7" fill="#35d6aa"/>
      <rect x="63" y="6" width="52" height="46" rx="7" fill="#35d6aa" opacity="0.86"/>
      <rect x="126" y="26" width="52" height="26" rx="7" fill="#35d6aa" opacity="0.72"/>
      <text x="214" y="22" fill="#26313d" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Inventory consistency</text>
      <text x="214" y="58" fill="#0f9f79" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">zero oversell</text>
