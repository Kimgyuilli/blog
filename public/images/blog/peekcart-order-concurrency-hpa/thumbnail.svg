      <path d="M92 61 C116 61 113 151 134 151" fill="none" stroke="#8bb7ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M226 41 C250 41 248 96 270 96" fill="none" stroke="#8bb7ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M226 151 C250 151 248 96 270 96" fill="none" stroke="#8bb7ff" stroke-width="3" stroke-linecap="round"/>
