<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">gRPC and Protocol Buffers contract repository</title>
  <desc id="desc">gRPC와 Protocol Buffers의 층위를 계약 저장소 관점에서 정리한 블로그 글 썸네일</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBFA"/>
      <stop offset="0.52" stop-color="#EEF6F3"/>
      <stop offset="1" stop-color="#F7F1E8"/>
    </linearGradient>
    <filter id="shadow" x="-14%" y="-18%" width="128%" height="136%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#10251F" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.42" stroke="#CADBD5" stroke-width="2">
    <path d="M78 120H1122"/>
    <path d="M78 252H1122"/>
    <path d="M78 384H1122"/>
    <path d="M78 516H1122"/>
    <path d="M178 70V560"/>
    <path d="M424 70V560"/>
    <path d="M670 70V560"/>
    <path d="M916 70V560"/>
  </g>

  <g transform="translate(76 78)">
    <text x="0" y="0" fill="#2F7D65" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="25" font-weight="800">BACKEND NOTE</text>
    <text x="0" y="86" fill="#15231F" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="64" font-weight="900">gRPC와</text>
    <text x="0" y="160" fill="#15231F" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="64" font-weight="900">Protocol Buffers</text>
    <text x="2" y="216" fill="#5D6A64" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="27" font-weight="600">계약 저장소를 읽기 위한 층위 구분</text>
  </g>

  <g transform="translate(86 450)">
    <rect x="0" y="0" width="120" height="50" rx="14" fill="#15231F"/>
    <text x="60" y="33" text-anchor="middle" fill="#F7FBFA" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" font-weight="800">proto</text>
    <rect x="138" y="0" width="118" height="50" rx="14" fill="#FFFFFF" stroke="#CBD8D2" stroke-width="2"/>
    <text x="197" y="33" text-anchor="middle" fill="#27332E" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" font-weight="800">gRPC</text>
    <rect x="274" y="0" width="142" height="50" rx="14" fill="#FFFFFF" stroke="#CBD8D2" stroke-width="2"/>
    <text x="345" y="33" text-anchor="middle" fill="#27332E" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" font-weight="800">codegen</text>
  </g>

  <g transform="translate(650 92)" filter="url(#shadow)">
    <rect x="0" y="0" width="416" height="78" rx="18" fill="#FFFFFF" stroke="#15231F" stroke-width="3"/>
    <text x="208" y="50" text-anchor="middle" fill="#15231F" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="28" font-weight="900">contract repository</text>

    <path d="M208 80V126" stroke="#15231F" stroke-width="4" stroke-linecap="round"/>
    <path d="M208 126C129 126 103 158 103 194" stroke="#15231F" stroke-width="4" stroke-linecap="round"/>
    <path d="M208 126C287 126 313 158 313 194" stroke="#15231F" stroke-width="4" stroke-linecap="round"/>

    <rect x="-2" y="196" width="214" height="112" rx="18" fill="#DDECE7" stroke="#15231F" stroke-width="3"/>
    <text x="105" y="238" text-anchor="middle" fill="#15231F" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="26" font-weight="900">message</text>
    <text x="105" y="272" text-anchor="middle" fill="#2F7D65" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="800">IDL + bytes</text>

    <rect x="234" y="196" width="214" height="112" rx="18" fill="#F2D9C9" stroke="#15231F" stroke-width="3"/>
    <text x="341" y="238" text-anchor="middle" fill="#15231F" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="26" font-weight="900">service</text>
    <text x="341" y="272" text-anchor="middle" fill="#79402B" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="800">HTTP/2 RPC</text>

    <path d="M105 310V356H208" stroke="#15231F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M341 310V356H236" stroke="#15231F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="356" width="306" height="94" rx="18" fill="#E8EEF4" stroke="#15231F" stroke-width="3"/>
