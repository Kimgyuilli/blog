<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Legacy API Strangler Fig Migration</title>
  <desc id="desc">빅뱅 이관에서 path-based strangler 방식으로 전환하는 블로그 글 썸네일</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAF6"/>
      <stop offset="0.56" stop-color="#EEF5F1"/>
      <stop offset="1" stop-color="#F4F1E8"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-20%" width="132%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17211C" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#CAD7D1" stroke-width="2">
    <path d="M80 122H1120"/>
    <path d="M80 254H1120"/>
    <path d="M80 386H1120"/>
    <path d="M80 518H1120"/>
    <path d="M176 70V560"/>
    <path d="M420 70V560"/>
    <path d="M664 70V560"/>
    <path d="M908 70V560"/>
  </g>

  <g transform="translate(78 78)">
    <text x="0" y="0" fill="#2F7D65" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="25" font-weight="800">MIGRATION NOTE</text>
    <text x="0" y="84" fill="#17211C" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="66" font-weight="900">Big Bang에서</text>
    <text x="0" y="158" fill="#17211C" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="66" font-weight="900">Strangler Fig로</text>
    <text x="2" y="214" fill="#5F6C65" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="27" font-weight="600">레거시 API를 path 단위로 점진 이관하기</text>
  </g>

  <g transform="translate(86 448)">
    <rect x="0" y="0" width="165" height="50" rx="14" fill="#17211C"/>
    <text x="82" y="33" text-anchor="middle" fill="#F8FAF6" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" font-weight="800">path split</text>
    <rect x="183" y="0" width="150" height="50" rx="14" fill="#FFFFFF" stroke="#CBD8D2" stroke-width="2"/>
    <text x="258" y="33" text-anchor="middle" fill="#27332E" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" font-weight="800">shared DB</text>
    <rect x="351" y="0" width="132" height="50" rx="14" fill="#FFFFFF" stroke="#CBD8D2" stroke-width="2"/>
    <text x="417" y="33" text-anchor="middle" fill="#27332E" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="21" font-weight="800">rollback</text>
  </g>

  <g transform="translate(652 92)" filter="url(#shadow)">
    <rect x="0" y="0" width="410" height="88" rx="18" fill="#FFFFFF" stroke="#17211C" stroke-width="3"/>
    <text x="205" y="55" text-anchor="middle" fill="#17211C" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="29" font-weight="900">ingress-nginx</text>

    <path d="M205 90V128" stroke="#17211C" stroke-width="4" stroke-linecap="round"/>
    <path d="M205 128C135 128 112 156 112 188" stroke="#17211C" stroke-width="4" stroke-linecap="round"/>
    <path d="M205 128C275 128 298 156 298 188" stroke="#17211C" stroke-width="4" stroke-linecap="round"/>

    <rect x="2" y="190" width="208" height="100" rx="18" fill="#F3D9C9" stroke="#17211C" stroke-width="3"/>
    <text x="106" y="230" text-anchor="middle" fill="#17211C" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="24" font-weight="900">legacy-api</text>
    <text x="106" y="262" text-anchor="middle" fill="#79402B" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="800">Go / Gin</text>

    <rect x="232" y="190" width="208" height="100" rx="18" fill="#CFE8DE" stroke="#17211C" stroke-width="3"/>
    <text x="336" y="230" text-anchor="middle" fill="#17211C" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="24" font-weight="900">new-api</text>
    <text x="336" y="262" text-anchor="middle" fill="#2F7D65" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="800">Spring Boot</text>

    <g transform="translate(84 332)">
      <ellipse cx="136" cy="18" rx="136" ry="18" fill="#E8EEF4" stroke="#17211C" stroke-width="3"/>
      <rect x="0" y="18" width="272" height="86" fill="#E8EEF4" stroke="#17211C" stroke-width="3"/>
      <ellipse cx="136" cy="104" rx="136" ry="18" fill="#DDE7EF" stroke="#17211C" stroke-width="3"/>
      <text x="136" y="68" text-anchor="middle" fill="#17211C" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="26" font-weight="900">shared Postgres</text>
    </g>

    <path d="M106 292V350H206" stroke="#17211C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M336 292V350H234" stroke="#17211C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="800">
      <rect x="4" y="136" width="132" height="38" rx="19" fill="#FFFFFF" stroke="#CBD8D2" stroke-width="2"/>
      <text x="70" y="161" text-anchor="middle" fill="#5F6C65">others</text>
      <rect x="276" y="136" width="152" height="38" rx="19" fill="#FFFFFF" stroke="#CBD8D2" stroke-width="2"/>
      <text x="352" y="161" text-anchor="middle" fill="#2F7D65">/api/*, /me</text>
    </g>
  </g>
