<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1120 336" width="1120" height="336" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker></defs>
<rect width="1120" height="384" fill="#ffffff"/>
<rect x="28" y="56" width="420" height="232" rx="6" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="44" y="84.0" font-size="16" font-weight="700" fill="#111" text-anchor="start">운영 조건을 본뜬 리허설 DB</text>
<text x="44" y="105.0" font-size="12" fill="#444" text-anchor="start">PG17, 비-superuser 작업 role, event trigger, 10만 행, 락 경합</text>
<rect x="48" y="124" width="380" height="56" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="238.0" y="156.9" font-size="14" font-weight="700" fill="#111" text-anchor="middle">검증 39건 모두 통과</text>
<rect x="48" y="196" width="380" height="72" rx="6" fill="#fff" stroke="#b42318" stroke-width="2"/>
<text x="238.0" y="229.0" font-size="14" font-weight="700" fill="#111" text-anchor="middle">role 멤버십이 권한을 상속</text>
<text x="238.0" y="247.0" font-size="12" fill="#b42318" text-anchor="middle">운영 DB는 상속하지 않는다</text>
<line x1="452" y1="172" x2="584" y2="172" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="518" y="160.0" font-size="13" fill="#111" text-anchor="middle">상속 설정을</text>
<text x="518" y="196.0" font-size="13" fill="#111" text-anchor="middle">운영과 맞춤</text>
<rect x="588" y="56" width="504" height="232" rx="6" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="604" y="84.0" font-size="16" font-weight="700" fill="#b42318" text-anchor="start">다시 돌리자 드러난 문제 3건</text>
<rect x="608" y="100" width="464" height="56" rx="6" fill="#fff" stroke="#b42318" stroke-width="2"/>
<text x="840.0" y="125.0" font-size="14" font-weight="700" fill="#111" text-anchor="middle">소유권 이전 직후 GRANT가 permission denied</text>
<text x="840.0" y="143.0" font-size="12" fill="#b42318" text-anchor="middle">적용 당일 터졌을 실제 버그</text>
<rect x="608" y="164" width="464" height="52" rx="6" fill="#fff" stroke="#b42318" stroke-width="2"/>
<text x="840.0" y="194.6" font-size="13" font-weight="700" fill="#111" text-anchor="middle">권한 재발급 대상과 검증의 판정 대상이 다른 role</text>
<rect x="608" y="224" width="464" height="52" rx="6" fill="#fff" stroke="#b42318" stroke-width="2"/>
<text x="840.0" y="254.6" font-size="13" font-weight="700" fill="#111" text-anchor="middle">재발급이 빠져도 권한 검사가 통과</text>
<rect x="28" y="304" width="1064" height="56" rx="6" fill="#111" stroke="#111" stroke-width="2"/>
<text x="48" y="337.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">고친 뒤 검증 42건 (락 수치도 실패 조건에 포함)</text>
<text x="468" y="337.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">운영 적용: 마이그레이션 이력 42행, 실패 0</text>
<text x="808" y="337.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">레거시 락 대기 최장 342ms (10만 행)</text>
</svg>
