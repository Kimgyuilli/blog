<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 660" width="1340" height="660" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="1340" height="660" fill="#ffffff"/>
  <text x="40" y="40" font-size="17" font-weight="700" fill="#111">사가의 정상 경로와, 그 경로가 남기는 "미결 종료 상태"를 닫는 장치</text>



  <!-- order lane -->
  <rect x="200" y="62" width="170" height="56" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <text x="285" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">주문 생성</text>
  <text x="285" y="106" text-anchor="middle" font-size="12" fill="#666">PENDING · @Version</text>

  <line x1="372" y1="90" x2="440" y2="90" stroke="#111" stroke-width="2" marker-end="url(#s1)"/>

  <!-- product lane: reservation -->
  <rect x="442" y="62" width="210" height="56" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <text x="547" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">재고 예약 (RESERVED)</text>
  <text x="547" y="106" text-anchor="middle" font-size="12" fill="#666">만료 시각(lease)을 함께 부여</text>

  <line x1="654" y1="90" x2="722" y2="90" stroke="#111" stroke-width="2" marker-end="url(#s1)"/>

  <rect x="724" y="62" width="190" height="56" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <text x="819" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">결제 승인</text>
  <text x="819" y="106" text-anchor="middle" font-size="12" fill="#666">만료된 lease는 승인 거부</text>

  <line x1="916" y1="90" x2="984" y2="90" stroke="#111" stroke-width="2" marker-end="url(#s1)"/>

  <rect x="986" y="62" width="200" height="56" fill="#111" stroke="#111" stroke-width="2" rx="3"/>
  <text x="1086" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">예약 확정 (CONFIRMED)</text>
  <text x="1086" y="106" text-anchor="middle" font-size="12" fill="#dddddd">정상 종료</text>

  <!-- lease box -->
  <rect x="200" y="160" width="986" height="80" fill="#f7f7f7" stroke="#999" stroke-width="1.5" rx="3"/>
  <text x="220" y="184" font-size="13.5" font-weight="700" fill="#111">lease &#8212; 만료 시각을 사가 참여자가 공유한다</text>
  <text x="220" y="206" font-size="13" fill="#333">Order가 <tspan font-weight="700">먼저</tspan> 취소하고 &#8594; Payment는 만료 lease 승인을 거부하고 &#8594; sweeper는 만료 + 유예 뒤에만 회수한다.</text>
  <text x="220" y="228" font-size="13" fill="#333">고정 TTL로 Product 혼자 판정하면 <tspan font-weight="700">살아 있는 주문의 재고를 뺏는다.</tspan> 정상 경로에서 sweeper 회수 건수는 0이어야 정상이고, 0이 아니면 그 자체가 알림 대상이다.</text>

  <!-- failure path -->
  <text x="40" y="300" font-size="14" font-weight="700" fill="#111">실패 · 미결 경로</text>

  <rect x="200" y="286" width="200" height="66" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <text x="300" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#111">감지 3지점</text>
  <text x="300" y="332" text-anchor="middle" font-size="12" fill="#666">Order 원장 · Product marker</text>
  <text x="300" y="348" text-anchor="middle" font-size="12" fill="#666">· Payment 소비 분기</text>

  <line x1="402" y1="318" x2="470" y2="318" stroke="#111" stroke-width="2" marker-end="url(#s1)"/>
  <text x="436" y="310" text-anchor="middle" font-size="11.5" fill="#333">REQUESTED</text>

  <rect x="472" y="286" width="210" height="66" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <text x="577" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#111">환불 원장 (fence)</text>
  <text x="577" y="334" text-anchor="middle" font-size="12" fill="#666">REQUESTED &#8594; CLAIMED (CAS)</text>

  <line x1="684" y1="318" x2="752" y2="318" stroke="#111" stroke-width="2" marker-end="url(#s1)"/>
  <text x="718" y="310" text-anchor="middle" font-size="11.5" fill="#333">claim한</text>
  <text x="718" y="336" text-anchor="middle" font-size="11.5" fill="#333">하나만</text>

  <rect x="754" y="286" width="200" height="66" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <text x="854" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#111">dispatcher</text>
  <text x="854" y="334" text-anchor="middle" font-size="12" fill="#666">여기서만 PG를 호출한다</text>

  <line x1="956" y1="318" x2="1024" y2="318" stroke="#111" stroke-width="2" marker-end="url(#s1)"/>

  <rect x="1026" y="286" width="160" height="66" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <text x="1106" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#111">회신으로 종결</text>
  <text x="1106" y="334" text-anchor="middle" font-size="12" fill="#666">결과별로 다른 종착</text>

  <rect x="200" y="372" width="986" height="76" fill="#f7f7f7" stroke="#999" stroke-width="1.5" rx="3"/>
  <text x="220" y="396" font-size="13" fill="#333"><tspan font-weight="700">소비 트랜잭션 안에서 외부를 호출하지 않는다.</tspan> PG 성공 후 롤백되면 fence 행이 사라져 fence 자체가 무효가 되기 때문 &#8212; 즉시성을 포기하고 crash 안전성을 얻는 교환이다.</text>
  <text x="220" y="418" font-size="13" fill="#333">보장은 "환불 API 호출 1회"가 아니라 <tspan font-weight="700">"동일 논리 환불 1건"</tspan>이다. 전자는 로컬 수단으로 달성할 수 없고, 후자로 두면 crash 경우의 수가 모두 "PG 조회로 진실 확정"으로 수렴한다.</text>
  <text x="220" y="440" font-size="13" fill="#333">환불 실패를 RESOLVED로 닫으면 원장이 거짓말한다 &#8212; 실패는 FAILED, 미확정은 전이하지 않고 reconciliation 후 수동 종결.</text>

  <line x1="40" y1="474" x2="1300" y2="474" stroke="#999" stroke-width="1"/>

  <!-- DLQ ledger -->
  <text x="40" y="506" font-size="14" font-weight="700" fill="#111">소비 실패 &#8212; 격리에서<tspan x="40" dy="18">끝내지 않는다</tspan></text>

  <rect x="200" y="492" width="160" height="52" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <text x="280" y="514" text-anchor="middle" font-size="13" fill="#111">재시도 3회</text>
  <text x="280" y="534" text-anchor="middle" font-size="12" fill="#666">1s · 5s · 30s</text>

  <line x1="362" y1="518" x2="418" y2="518" stroke="#111" stroke-width="2" marker-end="url(#s1)"/>

  <rect x="420" y="492" width="150" height="52" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <text x="495" y="523" text-anchor="middle" font-size="13" fill="#111">{topic}.dlq 격리</text>

  <line x1="572" y1="518" x2="628" y2="518" stroke="#111" stroke-width="2" marker-end="url(#s1)"/>

  <rect x="630" y="492" width="230" height="52" fill="#111" stroke="#111" stroke-width="2" rx="3"/>
  <text x="745" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">DLQ 원장</text>
  <text x="745" y="534" text-anchor="middle" font-size="12" fill="#dddddd">토픽 · 파티션 · 오프셋을 상태로</text>

  <line x1="862" y1="518" x2="918" y2="518" stroke="#777" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#s2)"/>

  <rect x="920" y="492" width="266" height="52" fill="#ffffff" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4" rx="3"/>
  <text x="1053" y="514" text-anchor="middle" font-size="13" fill="#111">replay 계약 (ADR-0020 · 0021)</text>
  <text x="1053" y="534" text-anchor="middle" font-size="12" fill="#666">상관 · 재개방 로직은 구현 중</text>

  <text x="200" y="576" font-size="13" fill="#555">Slack 알림은 사건을 <tspan font-weight="700">알릴</tspan> 뿐 재처리의 <tspan font-weight="700">입력</tspan>이 되지 못한다 &#8212; 그래서 미결을 상태로 남긴다.</text>
  <text x="200" y="598" font-size="13" fill="#555">replay 헤더는 <tspan font-weight="700">쓰기는 엄격하게</tspan>(키 집합 정확 일치) <tspan font-weight="700">읽기는 관대하게</tspan>(판독 실패해도 적재는 한다). 판독 실패는 "상관하지 않음"이지 "적재하지 않음"이 아니다.</text>
  <text x="200" y="628" font-size="12.5" fill="#888">※ 남은 것: 승인&#8596;회수 경합의 진짜 fence, PG 실호출 검증, replay 상관·재개방 &#8212; "계약은 그 구간을 없애는 게 아니라 보이게 만든다"</text>
</svg>
