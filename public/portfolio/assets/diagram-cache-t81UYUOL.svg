<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker></defs>
  <rect width="1120" height="420" fill="#ffffff"/>
  <text x="28" y="36" font-size="18" font-weight="700" fill="#111">재고 캐시의 경계: 표시 경로만 5초 캐시하고, 주문 경로는 DB를 읽는다</text>
  <text x="28" y="70" font-size="15" font-weight="700" fill="#111">상품 상세 조회 (표시용)</text>
  <rect x="28" y="86" width="170" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="113.0" y="120.4" font-size="14" font-weight="700" text-anchor="middle" fill="#111">GET /products/{id}</text>
  <rect x="226" y="86" width="170" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="311.0" y="120.4" font-size="14" font-weight="700" text-anchor="middle" fill="#111">product-service</text>
  <line x1="200" y1="116" x2="224" y2="116" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="424" y="84" width="300" height="48" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="574.0" y="112.2" font-size="13.5" text-anchor="middle" fill="#444">product 캐시 (TTL 30분): 상품명, 가격</text>
  <rect x="424" y="140" width="300" height="60" rx="6" fill="#111" stroke="#111" stroke-width="2"/>
  <text x="574.0" y="163.7" font-size="13.5" text-anchor="middle" fill="#e6e6e6">productStock 캐시 (TTL 5초)</text>
  <text x="574.0" y="184.7" font-size="13.5" text-anchor="middle" fill="#e6e6e6">표시용 재고, 최대 5초 늦을 수 있음</text>
  <line x1="398" y1="112" x2="422" y2="108" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="398" y1="122" x2="422" y2="164" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="780" y="96" width="312" height="92" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="936.0" y="125.4" font-size="14" font-weight="700" text-anchor="middle" fill="#111">miss일 때 DB 조회</text>
  <text x="936.0" y="146.7" font-size="13.5" text-anchor="middle" fill="#444">Pod당 동시 1개만 DB로</text>
  <text x="936.0" y="167.7" font-size="13.5" text-anchor="middle" fill="#444">넘치면 대기 없이 503 (PRD-005)</text>
  <line x1="726" y1="142" x2="778" y2="142" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="752" y="132" font-size="13" text-anchor="middle" fill="#444">miss</text>
  <line x1="28" y1="226" x2="1092" y2="226" stroke="#9a9a9a" stroke-width="1"/>
  <text x="28" y="258" font-size="15" font-weight="700" fill="#111">주문과 재고 예약</text>
  <rect x="28" y="274" width="170" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="113.0" y="308.4" font-size="14" font-weight="700" text-anchor="middle" fill="#111">order.created</text>
  <rect x="226" y="274" width="198" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="325.0" y="308.4" font-size="14" font-weight="700" text-anchor="middle" fill="#111">재고 예약 consumer</text>
  <rect x="452" y="274" width="272" height="60" rx="6" fill="#111" stroke="#111" stroke-width="2"/>
  <text x="588.0" y="297.9" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">DB 재고 (@Version)</text>
  <text x="588.0" y="319.2" font-size="13.5" text-anchor="middle" fill="#e6e6e6">재고 캐시는 읽지 않는다</text>
  <line x1="200" y1="304" x2="224" y2="304" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="426" y1="304" x2="450" y2="304" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="780" y="260" width="312" height="88" rx="6" fill="#ececec" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="936.0" y="287.4" font-size="14" font-weight="700" text-anchor="middle" fill="#111">Redis 장애 때</text>
  <text x="936.0" y="308.7" font-size="13.5" text-anchor="middle" fill="#444">상품 캐시는 건너뛰고 DB로 읽는다</text>
  <text x="936.0" y="329.7" font-size="13.5" text-anchor="middle" fill="#444">Gateway 보호 장치는 503으로 막는다</text>
  <text x="28" y="384" font-size="13.5" fill="#444">결정만 하고 구현하지 않은 것: 같은 키 miss 묶기, 재고 캐시 만료 전 갱신, Redis 장애 때 마지막 값 응답 (ADR-0046)</text>
</svg>
