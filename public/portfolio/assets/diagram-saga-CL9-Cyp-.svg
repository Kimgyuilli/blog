<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 452" width="1120" height="452" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker></defs>
  <rect width="1120" height="452" fill="#ffffff"/>
  <text x="28" y="36" font-size="18" font-weight="700" fill="#111">결제 승인과 환불: PG 호출은 트랜잭션 밖에서 한 번만</text>
  <text x="28" y="66" font-size="15" font-weight="700" fill="#111">승인 (ADR-0023, ADR-0034)</text>
  <rect x="28" y="80" width="210" height="96" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="133.0" y="101.1" font-size="15" font-weight="700" text-anchor="middle" fill="#111">POST /confirm</text>
  <text x="133.0" y="122.7" font-size="13.5" text-anchor="middle" fill="#444">202로 접수</text>
  <text x="133.0" y="143.7" font-size="13.5" text-anchor="middle" fill="#444">승인 원장 WAITING_STOCK</text>
  <text x="133.0" y="164.7" font-size="13.5" text-anchor="middle" fill="#444">payment.requested</text>
  <rect x="262" y="80" width="240" height="96" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="382.0" y="101.1" font-size="15" font-weight="700" text-anchor="middle" fill="#111">Product</text>
  <text x="382.0" y="122.7" font-size="13.5" text-anchor="middle" fill="#444">RESERVED → APPROVAL_HELD</text>
  <text x="382.0" y="143.7" font-size="13.5" text-anchor="middle" fill="#444">만료 전 예약만 CAS</text>
  <text x="382.0" y="164.7" font-size="13.5" text-anchor="middle" fill="#444">stock.approval.result</text>
  <rect x="524" y="80" width="214" height="96" rx="6" fill="#111" stroke="#111" stroke-width="2"/>
  <text x="631.0" y="101.1" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Payment</text>
  <text x="631.0" y="122.7" font-size="13.5" text-anchor="middle" fill="#e6e6e6">보호가 허가되면</text>
  <text x="631.0" y="143.7" font-size="13.5" text-anchor="middle" fill="#e6e6e6">PG 승인 1회 (트랜잭션 밖)</text>
  <text x="631.0" y="164.7" font-size="13.5" text-anchor="middle" fill="#e6e6e6">멱등키 approve-{orderId}</text>
  <rect x="766" y="80" width="326" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="929.0" y="106.4" font-size="14" text-anchor="middle" fill="#444">결과 확정: 승인 또는 실패</text>
  <rect x="766" y="132" width="326" height="44" rx="6" fill="#fff" stroke="#6b6b6b" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="929.0" y="158.4" font-size="14" text-anchor="middle" fill="#6b6b6b">결과 불명: PG 조회로만 확정, 재호출 안 함</text>
  <line x1="240" y1="128" x2="260" y2="128" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="504" y1="128" x2="522" y2="128" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="740" y1="112" x2="764" y2="102" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="740" y1="144" x2="764" y2="154" stroke="#6b6b6b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahm)"/>
  <text x="28" y="204" font-size="13.5" fill="#444">회수 잡은 RESERVED만 회수한다. 보호가 먼저면 PG 결과가 나올 때까지 그 재고는 다시 팔리지 않고, 회수가 먼저면 PG 호출은 0회다.</text>
  <line x1="28" y1="224" x2="1092" y2="224" stroke="#9a9a9a" stroke-width="1"/>
  <text x="28" y="256" font-size="15" font-weight="700" fill="#111">환불 (ADR-0018)</text>
  <rect x="28" y="270" width="270" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="42" y="293.1" font-size="15" font-weight="700" fill="#111">감지 3곳</text>
  <text x="42" y="314.7" font-size="13.5" fill="#444">Product: 해제된 예약에 결제 완료</text>
  <text x="42" y="335.7" font-size="13.5" fill="#444">Order: 취소된 주문에 결제 완료</text>
  <text x="42" y="356.7" font-size="13.5" fill="#444">Payment: 승인된 결제에 주문 취소</text>
  <rect x="326" y="270" width="230" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="441.0" y="303.6" font-size="15" font-weight="700" text-anchor="middle" fill="#111">payment_refunds</text>
  <text x="441.0" y="325.2" font-size="13.5" text-anchor="middle" fill="#444">order_id UNIQUE</text>
  <text x="441.0" y="346.2" font-size="13.5" text-anchor="middle" fill="#444">REQUESTED까지만 커밋</text>
  <rect x="584" y="270" width="230" height="100" rx="6" fill="#111" stroke="#111" stroke-width="2"/>
  <text x="699.0" y="293.1" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">dispatcher</text>
  <text x="699.0" y="314.7" font-size="13.5" text-anchor="middle" fill="#e6e6e6">REQUESTED → CLAIMED (CAS)</text>
  <text x="699.0" y="335.7" font-size="13.5" text-anchor="middle" fill="#e6e6e6">CLAIMED한 쪽만</text>
  <text x="699.0" y="356.7" font-size="13.5" text-anchor="middle" fill="#e6e6e6">PG 취소 호출</text>
  <rect x="842" y="270" width="250" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="967.0" y="293.1" font-size="15" font-weight="700" text-anchor="middle" fill="#111">payment.refunded</text>
  <text x="967.0" y="314.7" font-size="13.5" text-anchor="middle" fill="#444">각 서비스 원장 종결</text>
  <text x="967.0" y="335.7" font-size="13.5" text-anchor="middle" fill="#444">결과 불명이면 5분마다 조회,</text>
  <text x="967.0" y="356.7" font-size="13.5" text-anchor="middle" fill="#444">24시간 뒤 사람이 종결</text>
  <line x1="300" y1="320" x2="324" y2="320" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="558" y1="320" x2="582" y2="320" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="816" y1="320" x2="840" y2="320" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="35" cy="395.5" r="2.4" fill="#111"/>
  <text x="45" y="400" font-size="13.5" fill="#111">보장 범위는 같은 주문에 논리적 환불 1건이다. PG 호출 1회는 보장하지 않고, 응답이 사라지면 PG 조회로 확인한다.</text>
  <circle cx="35" cy="419.5" r="2.4" fill="#111"/>
  <text x="45" y="424" font-size="13.5" fill="#111">Toss 테스트 API로 승인과 환불 경로를 끝까지 확인했다 (2026-10-26, 간편결제 1건).</text>
</svg>
