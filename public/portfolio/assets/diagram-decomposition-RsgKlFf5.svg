  <rect x="382" y="56" width="380" height="380" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="398" y="84" font-size="15" font-weight="700" fill="#111">2. 동기 호출 제거 (06-16~19)</text>
