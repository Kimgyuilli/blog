<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 360" width="1340" height="360" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>

  <rect width="1340" height="360" fill="#ffffff"/>

  <text x="40" y="42" font-size="17" font-weight="700" fill="#111">진화 전략 — 단계마다 "이번에 해결할 문제"를 먼저 정하고 진입한다</text>

  <!-- Phase 1 -->
  <rect x="40" y="70" width="290" height="200" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <rect x="40" y="70" width="290" height="40" fill="#ececec" stroke="#111" stroke-width="2" rx="3"/>
  <text x="185" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Phase 1 · 모놀리식</text>
  <text x="62" y="140" font-size="13.5" fill="#333">· 5개 도메인 (User · Product ·</text>
  <text x="62" y="160" font-size="13.5" fill="#333">&#160;&#160;Order · Payment · Notification)</text>
  <text x="62" y="184" font-size="13.5" fill="#333">· 4-Layered + DDD</text>
  <text x="62" y="208" font-size="13.5" fill="#333">· JWT 인증 · Toss 결제</text>
  <text x="62" y="232" font-size="13.5" fill="#333">· 로컬 이벤트 · 타임아웃 스케줄러</text>
  <text x="62" y="256" font-size="12.5" fill="#666">문제: 도메인 경계를 어디에 긋나</text>

  <line x1="332" y1="170" x2="366" y2="170" stroke="#111" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Phase 2 -->
  <rect x="368" y="70" width="290" height="200" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <rect x="368" y="70" width="290" height="40" fill="#ececec" stroke="#111" stroke-width="2" rx="3"/>
  <text x="513" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Phase 2 · 성능 · 정합성</text>
  <text x="390" y="140" font-size="13.5" fill="#333">· Redis Cache-Aside</text>
  <text x="390" y="164" font-size="13.5" fill="#333">· 분산 락 + 낙관적 락 이중 방어</text>
  <text x="390" y="188" font-size="13.5" fill="#333">· Kafka + Transactional Outbox</text>
  <text x="390" y="212" font-size="13.5" fill="#333">· 멱등성 · DLQ · ShedLock</text>
  <text x="390" y="248" font-size="12.5" fill="#666">문제: 몰릴 때 무엇이 먼저 깨지나</text>

  <line x1="660" y1="170" x2="694" y2="170" stroke="#111" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Phase 3 -->
  <rect x="696" y="70" width="290" height="200" fill="#ffffff" stroke="#111" stroke-width="2" rx="3"/>
  <rect x="696" y="70" width="290" height="40" fill="#ececec" stroke="#111" stroke-width="2" rx="3"/>
  <text x="841" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Phase 3 · 인프라 · 관측성</text>
  <text x="718" y="140" font-size="13.5" fill="#333">· Kubernetes (Kustomize) · GKE</text>
  <text x="718" y="164" font-size="13.5" fill="#333">· Prometheus · Grafana</text>
  <text x="718" y="188" font-size="13.5" fill="#333">· nGrinder · k6 부하 실측</text>
  <text x="718" y="212" font-size="13.5" fill="#333">· HPA 1&#8594;3 자동 확장</text>
  <text x="718" y="248" font-size="12.5" fill="#666">문제: 개선됐다를 어떻게 증명하나</text>

  <line x1="988" y1="170" x2="1022" y2="170" stroke="#111" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Phase 4 -->
  <rect x="1024" y="70" width="276" height="200" fill="#ffffff" stroke="#111" stroke-width="2.5" rx="3"/>
  <rect x="1024" y="70" width="276" height="40" fill="#111" stroke="#111" stroke-width="2.5" rx="3"/>
  <text x="1162" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Phase 4 · MSA 분리</text>
  <text x="1046" y="140" font-size="13.5" fill="#333">· 5개 서비스 + Gateway</text>
  <text x="1046" y="164" font-size="13.5" fill="#333">· DB-per-service</text>
  <text x="1046" y="188" font-size="13.5" fill="#333">· Gateway 서명 내부 토큰</text>
  <text x="1046" y="212" font-size="13.5" fill="#333">· Choreography Saga · 보상/환불</text>
  <text x="1046" y="236" font-size="13.5" fill="#333">· DLQ 원장 · replay <tspan fill="#666">(진행 중)</tspan></text>
  <text x="1046" y="260" font-size="12.5" fill="#666">문제: 가른 뒤 무엇이 새로 깨지나</text>

  <line x1="40" y1="300" x2="1300" y2="300" stroke="#999" stroke-width="1"/>
  <text x="40" y="328" font-size="13" fill="#555">분산 시스템의 복잡도는 그것이 필요한 문제를 먼저 겪은 뒤 도입해야 설명할 수 있다 &#8212; 그래서 처음부터 MSA로 가지 않았다.</text>
</svg>
